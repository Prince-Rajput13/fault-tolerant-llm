services:
  - type: web
    name: fault-tolerant-llm-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    disk:
      name: sqlite_data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: LLM_API_KEYS
        sync: false
      - key: LLM_MODEL
        value: gemini/gemini-2.5-flash
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: DEFAULT_SYSTEM_PROMPT
        value: You are a helpful assistant.
